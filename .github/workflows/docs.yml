name: Verify documentation portal

on:
  pull_request:
    paths: ['docs/**', '**.md', '.github/workflows/docs.yml']
  push:
    branches: [main]
    paths: ['docs/**', '**.md', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: docs/.node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: docs-bun-${{ runner.os }}-1.4.2-${{ hashFiles('docs/bun.lock') }}
      - name: Install documentation dependencies
        run: bun install --frozen-lockfile
      - name: Audit dependencies
        run: bun audit --audit-level=high
      - name: Lint documentation
        run: bun run lint
      - name: Check documentation types
        run: bun run --bun check
      - name: Build and test portal
        run: bun run --bun test
      - name: Upload independently deployable documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation-site
          path: docs/build/
          retention-days: 7
